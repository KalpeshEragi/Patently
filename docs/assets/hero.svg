<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
  <title id="t">Patently</title>
  <desc id="d">Prior-art search and claim-by-claim novelty analysis for patent applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#16233a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
    </style>
  </defs>
  <rect width="960" height="300" rx="20" fill="url(#bg)"/>
  <rect width="960" height="300" rx="20" fill="url(#grid)"/>
  <rect width="960" height="300" rx="20" fill="url(#glow)"/>

  <!-- mark: document with a magnifier -->
  <g transform="translate(56 58)">
    <rect width="44" height="56" rx="6" fill="none" stroke="#8fb8de" stroke-width="2.5"/>
    <path d="M10 16h24M10 25h24M10 34h14" stroke="#8fb8de" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="38" cy="46" r="11" fill="#0d1420" stroke="#e9c46a" stroke-width="2.5"/>
    <path d="M46 54l8 8" stroke="#e9c46a" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="128" y="100" class="serif" font-size="46" font-weight="700" fill="#f3f1ea">Patently</text>
  <text x="58" y="152" class="sans" font-size="19" fill="#c9d3e0">Is this invention new? Search 100,000 patents and judge every claim</text>
  <text x="58" y="178" class="sans" font-size="19" fill="#c9d3e0">the way a patent examiner would, with the evidence to back it up.</text>

  <g class="sans" font-size="13">
    <g transform="translate(58 214)">
      <rect width="186" height="54" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="16" y="25" font-size="20" font-weight="700" fill="#f3f1ea">100K</text>
      <text x="16" y="43" fill="#93a3b8">patents searched</text>
    </g>
    <g transform="translate(258 214)">
      <rect width="186" height="54" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="16" y="25" font-size="20" font-weight="700" fill="#f3f1ea">92.7%</text>
      <text x="16" y="43" fill="#93a3b8">right CPC class in top 3</text>
    </g>
    <g transform="translate(458 214)">
      <rect width="186" height="54" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="16" y="25" font-size="20" font-weight="700" fill="#f3f1ea">87.2%</text>
      <text x="16" y="43" fill="#93a3b8">of rejected claims flagged</text>
    </g>
    <g transform="translate(658 214)">
      <rect width="244" height="54" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="16" y="25" font-size="20" font-weight="700" fill="#f3f1ea">17–19 s</text>
      <text x="16" y="43" fill="#93a3b8">claim matching (was ~60 s)</text>
    </g>
  </g>
</svg>
